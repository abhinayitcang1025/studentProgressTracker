<div class="student-detail" *ngIf="student">
  <h3>{{ student.name }} — Details</h3>
  <table>
    <tr><th>Subject</th><th>Marks</th></tr>
    <tr><td>Math</td><td>{{ student.math }}</td></tr>
    <tr><td>Science</td><td>{{ student.science }}</td></tr>
    <tr><td>English</td><td>{{ student.english }}</td></tr>
    <tr><td>Total</td><td>{{ student.total }}</td></tr>
    <tr><td>Provided Grade</td><td>{{ student.grade }}</td></tr>
    <tr><td>Computed Grade</td><td>{{ computeGrade(student.total) }}</td></tr>
  </table>
</div>
